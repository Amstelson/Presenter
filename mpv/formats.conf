# Picture framing for each screen format. The mpv service picks one with
# --profile=<format>, where <format> is PRESENTER_FORMAT (flat or scope).
#
# Each image is shrunk if huge, then padded with black to the format's shape
# without cropping or stretching. mpv then fits that frame into whatever
# resolution the Pi outputs. With a 2048x1080 (DCI 2K) output the picture
# area is exactly DCI: Flat 1998x1080, Scope 2048x858.
# The size limits keep every frame under the Pi 4 GPU limit of 4096 px.

[flat]
profile-desc=DCI Flat 1.85:1 (1998x1080)
vf=scale=w=[min(iw,3840)]:h=[min(ih,2075)]:force_original_aspect_ratio=decrease,pad=w=[ceil(max(iw,ih*1.85)/2)*2]:h=[ceil(max(ih,iw/1.85)/2)*2]:x=-1:y=-1

[scope]
profile-desc=DCI Scope 2.39:1 (2048x858)
vf=scale=w=[min(iw,3840)]:h=[min(ih,1608)]:force_original_aspect_ratio=decrease,pad=w=[ceil(max(iw,ih*2.3869)/2)*2]:h=[ceil(max(ih,iw/2.3869)/2)*2]:x=-1:y=-1
